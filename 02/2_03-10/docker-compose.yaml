services:
  backend:
    build:
      context: ..
      dockerfile: 2_03-10/Dockerfile.backend
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=redis
  frontend:
    build:
      context: ..
      dockerfile: 2_03-10/Dockerfile.frontend
    ports:
      - 5001:5001

  redis:
    image: redis:latest
    expose:
      - 6379
