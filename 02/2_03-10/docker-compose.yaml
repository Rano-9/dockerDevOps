services:
  backend:
    build:
      context: ..
      dockerfile: 2_03-10/Dockerfile.backend
    ports:
      - 8080:8000
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=postgres
      - REQUEST_ORIGIN=http://localhost:8000
  frontend:
    build:
      context: ..
      dockerfile: 2_03-10/Dockerfile.frontend
    ports:
      - 5001:5001

  redis:
    image: redis:latest

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DATABASE=postgres
      - POSTGRES_PASSWORD=postgres
    container_name: postgres_db 
    volumes:
      - ./database:/var/lib/postgresql
  
  nginx:
    image: nginx
    ports:
      - 8000:80
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend