services:
  backend:
    build:
      context: ..
      dockerfile: 2_03-10/Dockerfile.backend
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=postgres
  frontend:
    build:
      context: ..
      dockerfile: 2_03-10/Dockerfile.frontend
    ports:
      - 5001:5001

  redis:
    image: redis:latest

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DATABASE=postgres
      - POSTGRES_PASSWORD=postgres
    container_name: postgres_db 
    volumes:
      - database:/var/lib/postgresql

volumes:
  database: